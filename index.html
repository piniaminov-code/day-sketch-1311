<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🎉 שני, יום הולדת שמח!</title>
<style>
:root{--bg:#fff6ee;--ink:#4a2c3a;--rose:#e8557a;--gold:#f4b43c;--plum:#8a3a6b;--card:#fff;--mint:#5cc9a7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Heebo","Assistant","Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#ffe3ec 0,#fff6ee 340px,#fff6ee 100%);color:var(--ink);min-height:100vh;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
.hero{text-align:center;padding:34px 20px 18px;position:relative;overflow:hidden}
.hero .balloons{font-size:34px;letter-spacing:6px;animation:float 3s ease-in-out infinite}
.hero h1{font-size:34px;line-height:1.15;color:var(--rose);margin:8px 0 6px;font-weight:800}
.hero p{font-size:17px;color:var(--plum)}
.clock{display:inline-block;margin-top:12px;background:#fff;border-radius:999px;padding:6px 16px;font-size:14px;box-shadow:0 2px 8px #e8557a22}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.list{max-width:520px;margin:0 auto;padding:6px 16px;display:flex;flex-direction:column;gap:14px}
.item{background:var(--card);border-radius:22px;padding:16px 16px 18px;box-shadow:0 4px 16px #8a3a6b18;position:relative;overflow:hidden;border:2px solid transparent}
.item .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{background:var(--rose);color:#fff;font-weight:700;border-radius:12px;padding:3px 10px;font-size:15px;direction:ltr}
.item h2{font-size:19px;font-weight:800}
.item .emoji{font-size:28px;margin-inline-start:auto}
.body{font-size:17px;line-height:1.6}
.body .sign{margin-top:8px;color:var(--plum);font-weight:600}
.locked{background:#f6ecef;box-shadow:none;border:2px dashed #e5c3cf}
.locked .body{display:none}
.locked .lock{display:flex}
.lock{display:none;align-items:center;gap:8px;color:#a98595;font-size:16px}
.locked h2,.locked .emoji{filter:blur(5px);opacity:.6;user-select:none}
.fresh{border-color:var(--gold);animation:pop .6s ease}
.fresh::after{content:"חדש! ✨";position:absolute;top:10px;left:12px;background:var(--gold);color:#4a2c3a;font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px}
@keyframes pop{0%{transform:scale(.94);opacity:.5}100%{transform:scale(1);opacity:1}}
.slot{margin-top:10px;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(45deg,#fff0f5,#fff0f5 10px,#ffe6ee 10px,#ffe6ee 20px);border:2px dashed #e8a3b9;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:#b25a78;font-size:15px;padding:10px}
.slot img,.slot video{width:100%;display:block;border-radius:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid .slot{min-height:110px;margin:0}
.daughter{margin-top:10px;background:#fff7e6;border-radius:14px;padding:10px 12px}
.daughter b{color:var(--plum)}
.ph{display:inline-block;background:#fff3b0;color:#7a5a00;border-radius:6px;padding:0 6px;font-size:13px;font-weight:600}
.final{background:linear-gradient(135deg,#ffe0a8,#ffc2d4)}
.foot{text-align:center;padding:26px 20px;font-size:18px;color:var(--plum);font-weight:700}
.pv{position:fixed;bottom:0;left:0;right:0;background:#2b1a24ee;color:#fff;padding:10px 14px 14px;z-index:9;backdrop-filter:blur(6px);font-size:14px}
.pv .row{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
.pv input[type=range]{flex:1;direction:ltr}
.pv button{background:var(--gold);border:0;border-radius:10px;padding:6px 10px;font-weight:700;font-family:inherit}
.pv .t{min-width:48px;direction:ltr;font-weight:800;font-size:17px}
.pv small{display:block;max-width:520px;margin:4px auto 0;opacity:.7;text-align:center}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards;z-index:5;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
</style>
</head>
<body>
<header class="hero">
  <div class="balloons">🎈🎂🎈</div>
  <h1>יום הולדת שמח, שני!</h1>
  <p>היום כל שעה נפתחת הפתעה חדשה 💝</p>
  <div class="clock" id="clock"></div>
</header>
<main class="list" id="list"></main>
<div class="foot">אוהב אותך המון ❤️<br>פיני</div>

<div class="pv" id="pv" hidden>
  <div class="row">
    <span>🔧 תצוגה מקדימה</span>
    <input type="range" id="rng" min="6" max="17" step="1" value="8">
    <span class="t" id="tt">08:00</span>
    <button id="real">שעון אמיתי</button>
  </div>
  <small>הסרגל הזה לא יופיע אצל שני. גוררים כדי לראות איך נראה היום בכל שעה.</small>
</div>

<script>
/* ===== תוכן. כל מה שמסומן [..] הוא מקום שמור לעריכה ===== */
var BDAY="2026-11-13", TZ="+02:00"; // שעון חורף ישראל
var ITEMS=[
 {h:8,  emoji:"🥂", title:"בוקר טוב, יפה שלי",
  html:"<p>שני, יום הולדת שמח! 🥳🎉 היום מגיע לך יום שלם של פינוקים, ואני דאגתי שכל שעה תקבלי הפתעה קטנה. תלחצי, תחייכי, ותתמסרי 😍</p><p class='sign'>פיני ❤️</p>"},
 {h:9,  emoji:"🥐", title:"רמז ראשון: לאן הולכים לאכול",
  html:"<p>ב־10:00 מחכה לנו שולחן 🍳☕</p><p><b>הרמז:</b> רחוב על שם ראש העירייה הראשון של תל אביב, בית מספר 99.</p><p><span class='ph'>[נוסח הרמז - לעדכן]</span></p>"},
 {h:10, emoji:"👧", title:"ברכה מהבנות שלך",
  html:"<p>שלוש בנות שאוהבות אותך עד השמיים 💕</p><div class='daughter'><b>[שם בת 1]:</b> <span class='ph'>[ברכה]</span></div><div class='daughter'><b>[שם בת 2]:</b> <span class='ph'>[ברכה]</span></div><div class='daughter'><b>[שם בת 3]:</b> <span class='ph'>[ברכה]</span></div>",
  media:[{t:"video",src:"media/daughters.mp4",label:"🎬 כאן יבוא סרטון הבנות (media/daughters.mp4)"}]},
 {h:11, emoji:"📸", title:"זכרונות יפים",
  html:"<p>כמה רגעים שאני הכי אוהב איתך ✨</p>",
  media:[{t:"img",src:"media/photo1.jpg",label:"📷 תמונה 1"},{t:"img",src:"media/photo2.jpg",label:"📷 תמונה 2"},{t:"img",src:"media/photo3.jpg",label:"📷 תמונה 3"},{t:"img",src:"media/photo4.jpg",label:"📷 תמונה 4"}],grid:true},
 {h:12, emoji:"🎬", title:"סרטון קצר בשבילך",
  html:"<p>לחצי על play 🍿</p>",
  media:[{t:"video",src:"media/video.mp4",label:"🎬 כאן יבוא הסרטון (media/video.mp4)"}]},
 {h:13, emoji:"💌", title:"ברכות מההורים ומהחברים",
  html:"<p>כולם חושבים עלייך היום 🥰</p><div class='daughter'><b>[ההורים]:</b> <span class='ph'>[ברכה / סרטון]</span></div><div class='daughter'><b>[חברים וחברות]:</b> <span class='ph'>[ברכות]</span></div>",
  media:[{t:"video",src:"media/friends.mp4",label:"🎬 סרטון ברכה מההורים/חברים (אופציונלי)"}]},
 {h:14, emoji:"🧭", title:"רמז: מה עושים אחר הצהריים",
  html:"<p><span class='ph'>[הפעילות עדיין לא הוחלטה]</span></p><p>הרמז יתעדכן ברגע שנחליט 😉</p>"},
 {h:15, emoji:"🌟", title:"עוד קצת אהבה",
  html:"<p>עוד רגע קטן רק בשבילך 💖</p><p><span class='ph'>[מכתב אישי מפיני / תמונות נוספות]</span></p><p class='sign'>פיני</p>",
  media:[{t:"img",src:"media/photo5.jpg",label:"📷 תמונה נוספת"}]},
 {h:16, emoji:"🔥", title:"הרמז האחרון: הערב",
  cls:"final",
  html:"<p>האש כבר מתחממת 🥩🔥 הבית מתמלא בחברים, ואנחנו מתחילים ב־16:30. תתלבשי יפה, ותתכוננו לחגוג! 🎉🥳</p><p class='sign'>פיני ❤️</p>"}
];

var q=new URLSearchParams(location.search);
var PREVIEW=q.has("preview") || /^(localhost|127)/.test(location.hostname) || Date.now()<Date.parse(BDAY+"T00:00:00"+TZ);
var sim=null; // null = שעון אמיתי
var shown={};

function pad(n){return (n<10?"0":"")+n}
function nowMs(){return sim===null?Date.now():Date.parse(BDAY+"T"+pad(sim)+":00:00"+TZ)}
function unlocked(it){return nowMs()>=Date.parse(BDAY+"T"+pad(it.h)+":00:00"+TZ)}

function slotHTML(m){return '<div class="slot" data-t="'+m.t+'" data-src="'+m.src+'">'+m.label+'</div>'}
function build(){
  var l=document.getElementById("list"),out="";
  ITEMS.forEach(function(it,i){
    var open=unlocked(it);
    var media=(it.media||[]).map(slotHTML).join("");
    if(it.grid) media='<div class="grid">'+media+'</div>';
    out+='<section class="item '+(it.cls||"")+(open?"":" locked")+'" id="i'+i+'">'+
      '<div class="top"><span class="badge">'+pad(it.h)+':00</span><h2>'+(open?it.title:"הפתעה סודית")+'</h2><span class="emoji">'+(open?it.emoji:"🎁")+'</span></div>'+
      '<div class="lock">🔒 נפתח ב־'+pad(it.h)+':00</div>'+
      '<div class="body">'+it.html+(open?media:"")+'</div></section>';
  });
  l.innerHTML=out;
  loadMedia();
}
function loadMedia(){
  document.querySelectorAll(".slot[data-src]").forEach(function(s){
    if(s.dataset.done)return; s.dataset.done=1;
    var el=document.createElement(s.dataset.t==="video"?"video":"img");
    el.src=s.dataset.src; if(el.tagName==="VIDEO"){el.controls=true;el.playsInline=true;el.preload="metadata";}
    var label=s.innerHTML;
    el.onerror=function(){};
    var ev=el.tagName==="VIDEO"?"loadeddata":"load";
    el.addEventListener(ev,function(){s.innerHTML="";s.style.border="0";s.style.background="none";s.style.padding=0;s.appendChild(el);});
  });
}
function confetti(){
  var e=["🎉","🎈","✨","💖","🎊"];
  for(var i=0;i<18;i++){var c=document.createElement("div");c.className="confetti";c.textContent=e[i%5];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);setTimeout(function(x){x.remove()}.bind(null,c),5000);}
}
function tick(first){
  var d=new Date(nowMs()), prev=Object.assign({},shown), newOnes=0;
  ITEMS.forEach(function(it,i){var u=unlocked(it); if(u&&!prev[i]&&!first)newOnes++; shown[i]=u;});
  if(first||newOnes||sim!==null) build();
  var last=-1;ITEMS.forEach(function(it,i){if(unlocked(it))last=i});
  if(last>=0&&!first&&newOnes){document.getElementById("i"+last).classList.add("fresh");confetti();}
  var nxt=ITEMS.filter(function(it){return !unlocked(it)})[0];
  document.getElementById("clock").textContent=nxt?("ההפתעה הבאה ב־"+pad(nxt.h)+":00 ⏳"):"פתחת הכל! 🎉";
}
if(PREVIEW){
  var pv=document.getElementById("pv"),rng=document.getElementById("rng"),tt=document.getElementById("tt");
  if(q.has("h"))rng.value=q.get("h");pv.hidden=false;sim=+rng.value;tt.textContent=pad(sim)+":00";
  rng.oninput=function(){var prevSim=sim;sim=+rng.value;tt.textContent=pad(sim)+":00";tick(true);if(sim>prevSim){var l=-1;ITEMS.forEach(function(it,i){if(unlocked(it))l=i});if(l>=0){var el=document.getElementById("i"+l);el.classList.add("fresh");}}};
  document.getElementById("real").onclick=function(){sim=null;tt.textContent="עכשיו";tick(true)};
}
tick(true);
setInterval(function(){tick(false)},30000);
</script>
</body>
</html>
